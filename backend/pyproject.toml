[project]
name = "basketball-trimmer"
version = "0.1.0"
description = "Automatic basketball video trimmer using MediaPipe pose detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9.0",
    "ffmpeg-python>=0.2.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["models", "services"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
